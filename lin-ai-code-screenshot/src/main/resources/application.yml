spring:
  application:
    name: lin-ai-code-screenshot
server:
  port: 8127
  servlet:
    context-path: /api
# Dubbo
dubbo:
  registry:
    address: nacos://${NACOS_SERVER_ADDR:127.0.0.1:8848}
    username: ${NACOS_USERNAME}
    password: ${NACOS_PASSWORD}
    register-mode: instance
  protocol:
    name: tri
    port: 50052
  consumer:
    timeout: 120000
  provider:
    timeout: 120000
  application:
    qos-enable: false
